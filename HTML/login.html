<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../CSS/style.css">
        <title>Login</title>
    </head>
    <body class="Login">
        <header id="headerbar">
            <a href="../HTML/index.html" title="Coding Conference"><img src="../assets/logo-full.svg" alt="Coding Conf Logo"></a>
        </header>
        <main id="mainBody">
            <section>
                <h1>Your Journey to Coding Conf 2026 Starts Here!</h1>
        
                <p>Secure your spot at next year's biggest coding conference.</p>
            </section>
            <br>
            <section>
                <form action="">
                    <label for="imageUpload">
                        Upload Avatar
                    </label>
                    <fieldset>
                        <input type="file" id="imageUpload" name="image" accept="image/*">
                    </fieldset>
                    
                    <label for="name">
                        Full Name
                    </label>
                    <fieldset>
                        <input name="te" type="text" id="name" placeholder="John Doe" required>
                    </fieldset>
                    <label for="email">
                        Email Address
                    </label>
                    <fieldset>
                        <input name="em" type="email" id="email" placeholder="johndoe@email.com" required>
                    </fieldset>
                    
                    <label for="username">
                        Github Username
                    </label>
                    <fieldset>
                        <input name="us" type="text" id="username" placeholder="@yourusername" required>
                    </fieldset>

                    <fieldset>
                        <input type="submit" value="Generate Your Ticket" id="generateTicketButton"> <br> <br>
                    </fieldset>
                </form>
            </section>
        </main>
        
    </body>
</html>
