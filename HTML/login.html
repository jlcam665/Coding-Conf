<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../CSS/style.css">
        <script src="../js/validation.js"></script>
        <title>Login</title>
    </head>
    <body class="Login">
        <header id="headerbar">
            <a href="../HTML/index.html" title="Coding Conference"><img src="../assets/logo-full.svg" alt="Coding Conf Logo"></a>
        </header>
        <main id="mainBody">
            <section>
                <h1>Your Journey to Coding Conf 2026 Starts Here!</h1>
        
                <p>Secure your spot at next year's biggest coding conference.</p>
            </section>
            <br>
            <section>
                <form action="" method="" id="registrationForm">
                    <label for="imageUpload">Upload Avatar</label>

                    <label for="imageUpload" class="uploadBox">

                        <input type="file"
                            id="imageUpload"
                            name="image"
                            accept="image/png, image/jpeg"
                            required>

                        <img src="../assets/icon-upload.svg" alt="Upload" class="uploadIcon">

                        <p id="imageUploadPrompt">Drag and drop or click to upload</p>
                    </label>
                    <small class="error" id="imageError"></small>
                    <small id="subtitle">ⓘ Upload your photo (JPG or PNG, max size: 500KB).</small>
                    <br> <br>
                    
                    <label for="name">Full Name</label>
                    <fieldset>
                        <input name="te" type="text" id="name" placeholder="John Doe" required>
                        <small class="error" id="nameError"></small>
                    </fieldset>

                    <label for="email">Email Address</label>
                    <fieldset>
                        <input name="em" type="email" id="email" placeholder="johndoe@email.com" required>
                        <small class="error" id="emailError"></small>
                    </fieldset>
                    
                    <label for="username">Github Username</label>
                    <fieldset>
                        <input name="us" type="text" id="username" placeholder="@yourusername" required>
                        <small class="error" id="usernameError"></small>
                    </fieldset>

                    <fieldset>
                        <input type="submit" value="Generate My Ticket" id="generateTicketButton">
                    </fieldset>
                </form>
            </section>
        </main>
        
    </body>
</html>
