<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../CSS/style.css">
        <script src="../js/ticket.js" defer></script>
        <title>Ticket</title>
    </head>
    <body class="Ticket">
        <header id="headerbar">
            <a href="../index.html" title="Coding Conference"><img src="../assets/logo-full.svg" alt="Coding Conf Logo"></a>
        </header>
        <main id="mainBody">
            <section id="mainText">
                <h1>Congrats, <span id="headerName" class="gradient">---</span>!</h1>
                <h1>Your ticket is ready.</h1>
                <p>We've emailed your ticket to <span id="headerEmail">---</span> and will send updates in the run up to the event.</p>
            </section>
            <section id="ticketArea">
                <div id="text">
                    <div id="topHalf">
                        <img src="../assets/logo-full.svg" alt="">
                        <p>October 26, 2026 / Papine, Kgn</p>
                    </div>
                    <div id="bottomHalf">
                        <img id="ticketAvatar" src="../assets/image-avatar.jpg" alt="User avatar">
                        <div id="userInfo">
                            <div id="prt1">
                                <h3 id="ticketName">User Name</h3> <!--person's name-->
                            </div>
                            <div id="prt2">
                                <img src="../assets/icon-github.svg" alt="github">
                                <p id="ticketGithub">@username</p> <!--Github username-->
                            </div>
                        </div>
                    </div>
                </div>
                <p id="ticketNo">#01609</p>
            </section>
            
        </main>
    </body>
</html>
